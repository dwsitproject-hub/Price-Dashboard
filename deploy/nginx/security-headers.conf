# Included in the server block AND in every location that sets its own add_header:
# nginx drops all inherited add_header directives as soon as a location defines one.
# Install to /etc/nginx/snippets/aastar-security-headers.conf. Replace the Hub origin per environment.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://dwshub.kpndomain.com; connect-src 'self' https://dwshub.kpndomain.com; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self' https://dwshub.kpndomain.com; frame-ancestors 'none'; upgrade-insecure-requests" always;
