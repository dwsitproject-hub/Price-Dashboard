# AASTAR Price Dashboard — Server 1 (frontend ECS). TLS terminates at the ALB/SLB in front of this host.
# Replace: aastar.kpndomain.com, 10.20.10.11 (backend private IP), dwshub.kpndomain.com (Hub origin).

upstream aastar_api {
    server 10.20.10.11:8000;
    keepalive 16;
}

# Only the ALB health checker and the ALB itself reach this server (security group sg-fe).
server {
    listen 80 default_server;
    server_name aastar.kpndomain.com;

    root /opt/aastar/frontend/current;   # symlink → /opt/aastar/frontend/releases/<git-sha>
    index index.html;
    server_tokens off;
    client_max_body_size 1m;

    # Real client IP from the ALB (enable "X-Forwarded-For" on the listener)
    set_real_ip_from 10.20.1.0/24;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Security headers (TD §9.2) — re-included in each location that sets its own add_header.
    include /etc/nginx/snippets/aastar-security-headers.conf;

    location = /healthz { access_log off; return 200 "ok\n"; add_header Content-Type text/plain; }

    location /api/ {
        proxy_pass http://aastar_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 120s;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/aastar-security-headers.conf;
    }

    # Hashed, immutable build assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/aastar-security-headers.conf;
        try_files $uri =404;
    }
    location ~* \.map$ { deny all; }       # source maps are release artefacts, never served

    # SPA fallback; index.html must never be cached (new releases pick up immediately)
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/aastar-security-headers.conf;
    }
}
