# Host nginx vhost on the FE server 172.28.80.50 for http://aastar-pi.kpndomain.com (guide §11).
# The shared front door of many apps: this file adds ONE server block for ONE name and nothing else.
#   - never default_server: unknown names keep reaching whatever answered them before;
#   - the `listen` lines must match the ones the host's other vhosts use (guide §11 step 3 checks them): a
#     server that listens on 0.0.0.0:80 is never asked about requests arriving on a socket bound to 172.28.80.50:80;
#   - nginx -t before every reload: one broken file takes every site on this host down.
#
# Requires the release whose web container trusts this host nginx (TRUSTED_PROXY_CIDR / TRUSTED_HOST_IP in
# fe.compose.yml, v1.0.1 or later); otherwise every visitor shares one address in the audit log and the
# sign-in rate limit.
#
# Install as /etc/nginx/conf.d/aastar-pi.conf (or the host's sites-available + sites-enabled pattern), then:
#   nginx -t && systemctl reload nginx

server {
    listen 80;
    server_name aastar-pi.kpndomain.com;
    server_tokens off;

    access_log /var/log/nginx/aastar-pi.access.log;
    error_log  /var/log/nginx/aastar-pi.error.log;

    # Document and SND workbook uploads (the API allows up to 31 MB); the 1 MB default fails as a 413 here.
    client_max_body_size 32m;

    location / {
        proxy_pass http://172.28.80.50:3170;        # the app container's private-address port
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;   # required, or session cookies break
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 130s;                    # AI analysis and pipeline triggers; the app allows 120 s
    }
}

# With TLS later: a `listen 443 ssl;` server carrying the certificate and this location, and this port-80 server
# reduced to `return 301 https://$host$request_uri;` - then APP_BASE_URL https://..., secure cookies on.
