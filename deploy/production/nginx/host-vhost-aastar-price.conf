# FOR LATER - host nginx vhost on the FE server 172.28.80.50 for http://aastar-price.kpndomain.com.
# Day one users open http://172.28.80.50:3170 directly (AR-04, accepted); this file is NOT installed then.
# Use it only when the name is requested and resolves to 172.28.80.50 (guide §11).
#
# BEFORE installing it: the app container (frontend/nginx/default.conf.template) must trust this host
# nginx as a proxy (set_real_ip_from 172.28.80.50 and the aastar-price_net gateway, real_ip_header
# X-Forwarded-For). Without that, every user reaching the app through this vhost shares the address
# 172.28.80.50 in the audit log and the sign-in rate limits, and one person's failed sign-ins lock everyone
# out. That change ships in a release, together with the new APP_BASE_URL / HUB_REDIRECT_URI (guide §11).
#
# Install as /etc/nginx/conf.d/aastar-price.conf (or the host's sites-available pattern), then:
#   nginx -t && systemctl reload nginx        (nginx -t is NOT optional: this nginx is shared)
# Never default_server: unknown hosts must keep reaching whatever answered before.

server {
    listen 80;
    server_name aastar-price.kpndomain.com;
    server_tokens off;

    # Document and SND workbook uploads (the API allows up to 31 MB); the 1 MB default fails as a 413 here.
    client_max_body_size 32m;

    location / {
        proxy_pass http://172.28.80.50:3170;        # the app container's private-address port
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;   # required, or session cookies break
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 130s;                    # AI analysis and pipeline triggers; the app allows 120 s
    }
}

# With TLS: a `listen 443 ssl;` server carrying the certificate and this location, and the port-80 server
# reduced to `return 301 https://$host$request_uri;` - then APP_BASE_URL https://..., secure cookies on.
